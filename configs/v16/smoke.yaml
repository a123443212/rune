experiment:
  name: rune_v16_smoke
  seed: 42

research:
  allow_experimental: true

out_dir: runs/v16_smoke
data:
  dataset: smoke_v16
  teacher: synthetic_smoke
  positions:
    - 10000

models:
  - rune_attn_gab

architecture:
  tokens: 8
  token_dim: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

repro:
  pool: /tmp/smoke_pool.jsonl
  labeled: synthetic
  teacher_ckpt: none

interpretation: >
  Pass gate: screening finishes, metrics.json written per milestone,
  per-metric table reported with no composite score. Any claim still
  requires the matching full-scale leg vs re-run control; smoke alone
  promotes nothing.
