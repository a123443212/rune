experiment:
  name: rune_v16_leg_a_data10x
  seed: 42

research:
  allow_experimental: true

out_dir: runs/v16_leg_a

data:
  dataset: clean_v16_a
  teacher: teacher_v16_stockfish_d8_d12
  positions:
    - 250000000

models:
  - rune_attn_gab

architecture:
  tokens: 8
  token_dim: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: true

repro:
  pool: data/pool_v16.jsonl
  labeled: data/labeled_v16.jsonl
  engine: /path/to/stockfish
  depths: 8,12
