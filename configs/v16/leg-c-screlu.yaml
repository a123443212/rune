experiment:
  name: rune_v16_leg_c_screlu
  seed: 42

research:
  allow_experimental: true

out_dir: runs/v16_leg_c

data:
  dataset: clean_v15
  teacher: teacher_v15_stockfish_d12
  positions:
    - 25000000

models:
  - rune_attn_gab

architecture:
  tokens: 8
  token_dim: 32
  gate: screlu
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: true

repro:
  pool: data/pool.jsonl
  labeled: data/labeled.jsonl
  engine: /path/to/stockfish
  depth: 12
