experiment:
  name: rune_v09_t3_cascade
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v09_t3_cascade

data:
  dataset: target_v09
  teacher: teacher_md_v09
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_s2

architecture:
  tokens: 8
  token_dim: 16
  token_dims: [16, 16, 16, 16, 16, 16, 16, 16]
  pooling: none
  pool_clip: true
  gate_on: false
  shared_width: 32
  head_h1: 64
  head_h2: 16
  cheap_pooling: none
  gate: clip
  alpha: 0.5

routing:
  threshold: 0.5
  search_routing: difficulty
  t_high: null
  t_low: null

precision:
  base: fp32
  refine: fp32

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false
  uncertainty: false
  stability: false
  lambda_diff: 0.1
  diff_margin: 0.1

distillation:
  enabled: True
  task: value_wdl
  alpha: 0.5
  weight_mode: uniform

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  T3 cascade-teacher target. Dataset labeled via low-to-high routing; equal teacher compute vs T0 (S49).
