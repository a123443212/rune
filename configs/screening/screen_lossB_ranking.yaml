experiment:
  name: rune_v01_screening_stageB
  seed: 42

out_dir: runs/rune_v01_screening_stageB

data:
  dataset: clean_v01
  teacher: teacher_v01
  positions:
    - 10000000
    - 25000000
    - 50000000
    - 100000000

models: []

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: true

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  Stage B (ranking loss) runs only on architectures promoted from Stage A.
  Fill models explicitly with promoted candidates. Never mix architecture
  and loss changes in one comparison.
