experiment:
  name: rune_v11_avx2
  seed: 11

research:
  allow_experimental: false

out_dir: runs/rune_v11_avx2

compile:
  model: spec/test-vectors/models/small-gab-fp32.rune
  target: isa=avx2
  out: artifacts/network.avx2.rune

bench:
  iters: 2000
  modes: [generic, specialized]

gates:
  latency_warn_pct: 5.0
  nps_warn_pct: 5.0
  code_size_warn_pct: 20.0
