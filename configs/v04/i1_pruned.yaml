experiment:
  name: rune_v04_i1_pruned
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v04_i1_pruned

data:
  dataset: clean_v04
  teacher: teacher_v04
  positions:
    - 25000000
    - 50000000

models:
  - rune_04_adaptive

architecture:
  tokens: 8
  token_dim: 32
  cheap_pooling: none
  gate: clip
  alpha: 1.0
  pruned_pairs: [[0, 4], [4, 0], [1, 4], [4, 1], [2, 7], [7, 2], [3, 7], [7, 3]]

routing:
  threshold: 0.5
  t_high: null
  t_low: null

precision:
  base: fp32
  refine: fp32

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false
  lambda_diff: 0.1
  diff_margin: 0.1

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  I1. Pruned interaction hypothesis (8 fixed pairs zeroed, shape
  predictable). Retrain mandatory; tolerance re-checked after.
  Pattern is a hypothesis, not a finding.
