experiment:
  name: rune_v05_a2_routing
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v05_a2_routing

data:
  dataset: clean_v05
  teacher: teacher_v05
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_05_routing

architecture:
  tokens: 8
  token_dim: 32
  cheap_pooling: none
  gate: clip
  alpha: 1.0

routing:
  threshold: 0.5
  search_routing: both
  t_high: null
  t_low: null

precision:
  base: fp32
  refine: fp32

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false
  uncertainty: true
  stability: false
  lambda_diff: 0.1
  diff_margin: 0.1

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  A2. Uncertainty-aware routing R2 at matched refinement rates. Routing gain isolated.
