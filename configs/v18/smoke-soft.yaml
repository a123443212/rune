experiment:
  name: rune_v18_smoke_soft
  seed: 42

research:
  allow_experimental: true

out_dir: runs/v18_smoke_soft
data:
  dataset: smoke_v16
  teacher: synthetic_smoke
  positions:
    - 10000

models:
  - rune_attn_gab
  - rune_attn_soft
  - rune_mlp_swiglu

architecture:
  tokens: 8
  token_dim: 32
  gate: clip
  alpha: 1.0
  pair: false

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

repro:
  pool: /tmp/smoke_pool.jsonl
  labeled: synthetic
  teacher_ckpt: none

interpretation: >
  Pass gate: control (rune_attn_gab) and candidates (rune_attn_soft,
  rune_mlp_swiglu) finish screening, metrics.json written per milestone,
  per-metric table with no composite score. Smoke alone promotes nothing;
  needs a full-scale leg vs re-run control + engine_match SPRT.
