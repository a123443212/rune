experiment:
  name: rune_v02_explicit_250m
  seed: 42

out_dir: runs/rune_v02_250m

data:
  dataset: clean_v02
  teacher: teacher_v02
  positions:
    - 250000000

models: []

architecture:
  tokens: 8
  token_dim: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 1024
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: int8

evaluation:
  validation: true
  benchmark: true
  engine_match: true

note: >
  250M for human-promoted candidates only. Fill models explicitly.
  Exports int8 to validate the quantization path on a trained model.
