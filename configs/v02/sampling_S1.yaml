experiment:
  name: rune_v02_sampling_S1
  seed: 42

out_dir: runs/rune_v02_sampling_S1

data:
  dataset: clean_v02
  teacher: teacher_v02
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_rel_s

architecture:
  tokens: 8
  token_dim: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: disagreement_mix
  base: stratified
  disagreement_ratio: 0.2

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  S1 runs on the promoted candidate only, after the S0 stratified baseline
  exists. Compare against the same model in screen_arch (S0). Teacher
  labeling cost must be reported alongside any data-saving claim.
