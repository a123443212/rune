arch: RUNE-REL-02
seed: 7
lr: 0.0003
batch_size: 32
lambda_rank: 0.1
budget: 2000

rel_params:
  tokens: 8
  token_dim: 32
  gate: clip
  alpha: 1.0
  dynamic_bias: false

pairs: data/siblings.jsonl
out_dir: runs/rune_v02_loss_L1

note: >
  L1 driver config for training/experiments/ranking_ablation.py. L0 trains
  Value+WDL, L1 adds ranking on true sibling pairs. Same arch, same data,
  same seed: only the loss differs.
