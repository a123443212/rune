experiment:
  name: rune_v03_p1_shared
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v03_p1_shared

data:
  dataset: clean_v03
  teacher: teacher_v03
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_03D

architecture:
  tokens: 8
  token_dim: 32
  token_dims: [32, 32, 32, 32, 32, 32, 32, 32]
  pooling: shared
  pool_clip: true
  gate_on: false
  shared_width: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  P1. Shared 32-wide projection plus token-specific scale/bias on
  uniform 8x32. Shared width 32 forces uniform dims at total 256;
  variable allocation stays on the per-token path until analysis says
  otherwise.
