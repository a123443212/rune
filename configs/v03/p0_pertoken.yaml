experiment:
  name: rune_v03_p0_pertoken
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v03_p0_pertoken

data:
  dataset: clean_v03
  teacher: teacher_v03
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_03B

architecture:
  tokens: 8
  token_dim: 32
  token_dims: [32, 32, 32, 32, 32, 32, 32, 32]
  pooling: per_token
  pool_clip: true
  gate_on: false
  shared_width: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  P0. Per-token pooling on uniform 8x32. Compare against P1 (shared
  projection, same uniform dims). Shared has strictly fewer params, so
  a shared match is evidence of removed redundancy; a shared loss is
  inconclusive without a param-matched control.
