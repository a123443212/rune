experiment:
  name: rune_v03_a1_realloc
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v03_a1_realloc

data:
  dataset: clean_v03
  teacher: teacher_v03
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_03A

architecture:
  tokens: 8
  token_dim: 32
  token_dims: [28, 32, 32, 28, 20, 48, 40, 28]
  pooling: none
  pool_clip: true
  gate_on: false
  shared_width: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  A1. H1 hypothesis allocation (pawn 28, king 32, minor 32, rook 28,
  queen 20, threat 48, mobility 40, global 28; total 256) with no
  other change vs A0. Isolates reallocation. H1 is a hypothesis under
  test, re-derived from representation analysis afterwards, never a
  claim of optimality.
