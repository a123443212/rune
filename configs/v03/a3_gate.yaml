experiment:
  name: rune_v03_a3_gate
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v03_a3_gate

data:
  dataset: clean_v03
  teacher: teacher_v03
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_03C

architecture:
  tokens: 8
  token_dim: 32
  token_dims: [28, 32, 32, 28, 20, 48, 40, 28]
  pooling: per_token
  pool_clip: true
  gate_on: true
  shared_width: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  A3. A2 plus tiny bounded channel gate. Kill-on-no-gain: if A3 does
  not beat A2 on validation at matched cost, the gate leaves the core.
