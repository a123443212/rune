experiment:
  name: rune_v03_mixer_check
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v03_mixer_check

data:
  dataset: clean_v03
  teacher: teacher_v03
  positions:
    - 25000000
    - 50000000

models:
  - rune_rel_s

architecture:
  tokens: 8
  token_dim: 32
  gate: clip
  alpha: 1.0

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  Mixer necessity check. Compares the v0.2 relational mixer against
  the winning dense representation at 25M/50M only. If the simple path
  matches, the mixer leaves the core and v0.4 inherits representation
  work, not a bigger mixer. Static bias only; dynamic stays stripped.
