experiment:
  name: rune_v06_teacher
  seed: 42

research:
  allow_experimental: true

out_dir: runs/rune_v06_teacher

data:
  dataset: clean_v06
  teacher: teacher_v06
  positions:
    - 25000000
    - 50000000
    - 100000000

models:
  - rune_05_unc

architecture:
  tokens: 8
  token_dim: 32
  token_dims: [32, 32, 32, 32, 32, 32, 32, 32]
  pooling: none
  pool_clip: true
  gate_on: false
  shared_width: 32
  head_h1: 128
  head_h2: 32
  cheap_pooling: none
  gate: clip
  alpha: 1.0

routing:
  threshold: 0.5
  search_routing: difficulty
  t_high: null
  t_low: null

precision:
  base: fp32
  refine: fp32

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 256
  log_every: 200

loss:
  value: true
  wdl: true
  ranking: false
  uncertainty: false
  stability: false
  lambda_diff: 0.1
  diff_margin: 0.1

distillation:
  enabled: false
  task: value_wdl
  alpha: 0.5
  weight_mode: uniform

sampling:
  mode: none

export_quant: fp32

evaluation:
  validation: true
  benchmark: true
  engine_match: false

note: >
  T0 production. rune_05_unc at scale; selects the teacher on validation + calibration + cost, never by version recency.
