[package]
name = "rune-cli"
version = "0.11.0"
edition = "2021"

[[bin]]
name = "rune"
path = "src/main.rs"

[dependencies]
rune-spec = { path = "../rune-spec" }
rune-model = { path = "../rune-model" }
rune-kernel = { path = "../rune-kernel" }
rune-runtime = { path = "../rune-runtime" }
rune-ir = { path = "../rune-ir" }
rune-compiler = { path = "../rune-compiler" }
rune-search = { path = "../rune-search" }
serde_json = "1"

[dev-dependencies]
shakmaty = "0.30"
